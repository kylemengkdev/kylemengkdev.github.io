<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>页面不存在 · 404</title>
<script>
(function () {
  var targets = {
    'rouguang-video': 'https://kiria-kyle.github.io/rouguang-video',
    'rouguang-site': 'https://kiria-kyle.github.io/rouguang-site'
  };
  var m = window.location.pathname.match(/^\/(rouguang-video|rouguang-site)(\/.*)?$/);
  if (m && targets[m[1]]) {
    var rest = m[2] || '/';
    window.location.replace(targets[m[1]] + rest + window.location.search + window.location.hash);
  }
})();
</script>
</head>
<body>
<p>页面不存在（404）。</p>
<p>柔光工作室：<a href="https://kiria-kyle.github.io/rouguang-site/">kiria-kyle.github.io/rouguang-site</a></p>
<p>ROUGUANG VIDEO：<a href="https://kiria-kyle.github.io/rouguang-video/">kiria-kyle.github.io/rouguang-video</a></p>
</body>
</html>
